[package]
name = "whatoeat"
version = "0.1.0"
edition = "2024"
default-run = "whatoeat"
description = "A local-first food picker that learns when you want to eat something again"

[features]
default = []
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
preview = ["dioxus/ssr"]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks", "launch", "document"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rusqlite = { version = "0.38", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
directories = "6"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"

[dev-dependencies]
tempfile = "3"

# Dioxus selects this profile for Android --release; other platforms keep theirs.
# DX strips only after extracting bundled assets, preserving JNI dynamic exports.
[profile.android-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
debug = 0
strip = "symbols"

[[bin]]
name = "whatoeat"
path = "src/main.rs"

[[bin]]
name = "preview"
path = "src/bin/preview.rs"
required-features = ["preview"]
